schema_version = "1.1"

[task]
name = "zozo123/longmem-mini"
description = "Run a tiny LongMemEval-style memory benchmark and verify the expected mini leaderboard."
authors = [{ name = "Yossi Eliaz" }]
keywords = ["memory", "rag", "retrieval", "longmemeval", "islo", "harbor"]

[metadata]
category = "long-term-memory"
difficulty_explanation = "Tiny deterministic demo task for validating benchmark wiring, not a model leaderboard."

[agent]
timeout_sec = 120.0
user = "root"

[verifier]
timeout_sec = 120.0
user = "root"

[environment]
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 4096
allow_internet = false
